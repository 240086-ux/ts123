<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Airal, sans-serif;
            text-align: center;
            padding:100px;
            background: #f4f4f4;;
        }
        button{
            padding:12px 24px;
            font-size:18px;
            background:#4285f4;
            color:white;
            border:none;
            border-radius: 8px;
            cursor:pointer;
        }
        button:hover {background:#3367d6;}
        #userP{margin-top:30px; font-size:18px;}
    </style>
</head>
<body>
    <h1>Вход в приложение</h1>

    <button onclick = "signInWithGoogle()">Войти через  Google</button>

    <div id = "user"></div>

    <script>
        const SUPERBASE_URL = 'https://yvrkuubtadoeyxkmyflp.supabase.co'; 
        const SUPERBASE_ANON_KEY = ''; 

        const supabase = Supabase.createClient(SUPERBASE_ANON_KEY, SUPERBASE_URL); 
        
        async function signInWithGoogle() {
            const {error} = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin
                }
            });
            
            if (error) console.error(error); 
        }

        async function checkUser() {
      const { data: { session } } = await supabase.auth.getSession();
      
      const userDiv = document.getElementById('user');
      if (session) {
        userDiv.innerHTML = `
          <p>✅ Вы вошли как:<br><strong>${session.user.email}</strong></p>
          <button onclick="logout()">Выйти</button>
        `;
      } else {
        userDiv.innerHTML = '<p>Вы не авторизованы</p>';
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    // Запуск при загрузке страницы
    window.onload = checkUser;

    // Слушаем изменения авторизации
    supabase.auth.onAuthStateChange((event, session) => {
      checkUser();
    });
    </script>
</html>
